[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "crispy-ipa"
version = "0.1.1"
description = "automatic english-to-IPA text transcriber"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "kodovy-pesets" }]
keywords = [
    "transcription",
    "english",
    "tts",
    "text-to-speech",
    "nlp",
    "text-processing",
    "g2p",
    "ipa",
]

classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
    "Topic :: Text Processing :: Linguistic",
    "Natural Language :: English",
]

[project.optional-dependencies]
dev = [
    "build>=1.0.0",
    "twine>=5.0.0",
]

[project.urls]
Homepage = "https://github.com/Isyarname/crispy-ipa"
Repository = "https://github.com/Isyarname/crispy-ipa"
Issues = "https://github.com/Isyarname/crispy-ipa/issues"

# src-layout: setuptools ищет пакеты внутри src/
[tool.setuptools.packages.find]
where = ["src"]

# Включаем текстовые ресурсы (словари, DSL-правила) в wheel
[tool.setuptools.package-data]
"crispy_ipa" = ["data/*.pkl"]